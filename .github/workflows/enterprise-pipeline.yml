name: Enterprise Isolated GitOps Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-sync-enterprise:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Application Code
      uses: actions/checkout@v4

    - name: Build Docker Container
      run: |
        echo "Building clean enterprise image..."
        docker build -t CloudSamraatC/argo-demo-app:${{ github.sha }} .

    - name: Deploy to Enterprise GitOps Repo
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Completely cleaned up URL path with no broken brackets
        git clone "https://x-access-token:${{ secrets.GITOPS_TOKEN }}@://github.com"
        cd argo-gitops-enterprise
        
        # Updates the deployment image tag marker inside the clean base folder
        sed -i "s|image: .*|image: CloudSamraatC/argo-demo-app:${{ github.sha }}|g" base/deployment.yaml
        
        git add base/deployment.yaml
        git commit -m "chore(cd): isolated enterprise release tag ${{ github.sha }} [skip ci]"
        git push
