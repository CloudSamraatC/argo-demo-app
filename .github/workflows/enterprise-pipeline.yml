name: Enterprise Isolated GitOps Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-sync-enterprise:
    runs-on: ubuntu-latest

    steps:
    # 1. Pull down your python code
    - name: Checkout Application Code
      uses: actions/checkout@v4

    # 2. Simulate building your image
    - name: Build Docker Container
      run: |
        echo "Building clean enterprise image..."
        docker build -t CloudSamraatC/argo-demo-app:${{ github.sha }} .

    # 3. Use an official action to update the file in your other repository automatically
    - name: Push Manifest Update to Enterprise Repo
      uses: dmnemec/copy_file_to_another_repo_action@main
      env:
        API_TOKEN_GITHUB: ${{ secrets.GITOPS_TOKEN }}
      with:
        # Changed from 'base/deployment.yaml' because the file sits in your root directory!
        source_file: 'Dockerfile' 
        destination_repo: 'CloudSamraatC/argo-gitops-enterprise'
        destination_folder: 'base'
        user_email: 'github-actions[bot]@://github.com'
        user_name: 'github-actions[bot]'
        commit_message: 'chore(cd): isolated enterprise release tag [skip ci]'

